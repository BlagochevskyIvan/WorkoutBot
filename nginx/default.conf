# Docker DNS tracks service names when containers are recreated.
resolver 127.0.0.11 valid=5s ipv6=off;
resolver_timeout 2s;

upstream web_upstream {
    zone web_upstream 64k;
    server web:3000 resolve;
}

upstream server_upstream {
    zone server_upstream 64k;
    server app:8000 resolve;
}

server {
    listen 80;
    server_name _;
    
    # Debug logs
    error_log /var/log/nginx/error.log debug;
    access_log /var/log/nginx/access.log;

    # Это API FastAPI
    location /api/ {
        proxy_pass http://server_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /telegram {
        proxy_pass http://server_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Удобно для проверки жив ли бэк
    location /healthz {
        proxy_pass http://server_upstream/healthz;
        proxy_set_header Host $host;
    }
    location /docs {
        proxy_pass http://server_upstream/docs;
        proxy_set_header Host $host;
    }
    location /openapi.json {
        proxy_pass http://server_upstream/openapi.json;
        proxy_set_header Host $host;
    }
    # Это mini app (Next.js)
    location / {
        proxy_pass http://web_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

}
