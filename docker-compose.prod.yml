services:
  db:
    image: postgres:15
    container_name: workout_bot-db-1
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST_AUTH_METHOD: trust
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 1s
      timeout: 3s
      retries: 15
      start_period: 2s
    ports:
      - "5434:5432"
    volumes:
      - workout_data:/var/lib/postgresql/data
    networks:
      - backend

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: workout_bot-app
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/app"]
    env_file:
      - ./.env
    
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"
    volumes:
      - ./main.py:/app/main.py
      - ./config:/app/config
      - ./db:/app/db
      - ./handlers:/app/handlers
      - ./libs:/app/libs
      - ./server:/app/server
      - ./bot_cache:/app/bot_cache
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8000), 2).close()"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 15s
    networks:
      - backend
  
  web:
    build:
      context: ./web
      dockerfile: Dockerfile.prod
      args:
        NEXT_PUBLIC_URL: ${NEXT_PUBLIC_URL}
    container_name: workout_bot-web-1
    restart: always
    env_file:
      - ./.env
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_URL: ${NEXT_PUBLIC_URL}
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "const net = require('net'); const socket = net.createConnection({host: '127.0.0.1', port: 3000}); socket.setTimeout(2000); socket.on('connect', () => { socket.end(); process.exit(0); }); socket.on('error', () => process.exit(1)); socket.on('timeout', () => process.exit(1));"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 15s
    networks:
      - backend
  
  nginx:
    image: nginx:1.27-alpine
    container_name: miniapp_nginx
    ports:
      - "8003:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      web:
        condition: service_healthy
      app:
        condition: service_healthy
    networks:
      - backend

volumes:
  workout_data:
  web_node_modules:
  web_next_cache:

networks:
  backend:
    driver: bridge
