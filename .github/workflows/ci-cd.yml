name: ci-cd
on:
  push:
    branches:
      - main
  pull_request:

env:
  SITE_URL: https://workoutbot.termiweb.ru

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: test_db
        ports:
          - 5435:5432
        options: >-
          --health-cmd "pg_isready -U user -d test_db"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.12
          cache: pip
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      - name: Run tests
        run: |
          python -m pytest -q
  deploy:
    needs:
      tests
    if:
      github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Кладём ssh-ключ
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Выкатываем на сервер
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "cd ~/WorkoutBot && git pull --ff-only && docker compose -f docker-compose.prod.yml up -d --build"

      - name: Smoke-тест
        run: curl --fail --retry 20 --retry-delay 3 --retry-all-errors "${{ env.SITE_URL }}/healthz"
